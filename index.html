<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteador de Nomes e Amigo Secreto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
 
    <header class="hero">
      <div class="hero-label">✦ sorteio</div>
      <h1>Sorteador</h1>
      <h2>de Nomes <span class="accent">&</span> Amigo Secreto</h2>
    </header>

    <section class="cardP">
      <h3>Participantes</h3>

      <input 
        type="text" 
        id="inputNome" 
        placeholder="Digite um nome ou vários separados por vírgula">

      <button id="btnAdicionar">Adicionar</button>

      <p>Total de participantes: <span id="totalParticipantes">0</span></p>

      <ul id="listaParticipantes"><span id="limparNome"></span></ul>
    </section>

    <section class="cardSS">
      <h3>Sorteio Simples</h3>
      <p>Sorteie um nome aleatório da lista.</p>

      <button id="btnSortearSimples">Sortear Nome</button>

      <p id="resultadoSimples"></p>

      <button id="btnNovamente">Sortear Novamente</button>
    </section>

    <section class="cardAS">
      <h3>Amigo Secreto</h3>
      <p>Cada participante poderá ver apenas o seu amigo secreto.</p>

      <button id="btnSortearAmigo">Realizar Sorteio</button>
      <button id="btnRefazer">Refazer Sorteio</button>

      <p id="msgAmigoSecreto"></p>

      <ul id="listaResultados"></ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
